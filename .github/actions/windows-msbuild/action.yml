name: Windows MSBuild
description: Restore vcpkg, build Envy.sln for one platform/config, optionally run EnvyTests.

inputs:
  platform:
    description: MSBuild platform (x64 or Win32)
    required: true
  configuration:
    description: MSBuild configuration (Release or Debug)
    required: true
  upload-binaries:
    description: Upload Release binaries as artifacts
    required: false
    default: "false"
  run-tests:
    description: Run EnvyTests.exe after a successful build
    required: false
    default: "true"
  envy-bugsplat-database:
    description: Optional BugSplat database name for trusted x64 Release builds (/p:EnvyBugSplatDatabase)
    required: false
    default: ""
  upload-logs:
    description: Upload MSBuild logs
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57  # v3
      with:
        msbuild-architecture: x64

    - name: Verify Visual Studio 2026 with v145 is installed
      shell: pwsh
      run: |
        msbuild -version
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        if (-not (Test-Path $vswhere)) {
          Write-Error "vswhere.exe not found at $vswhere - cannot validate VS install."
          exit 1
        }
        $installVersion = (& $vswhere -latest -prerelease -property installationVersion) -as [string]
        $displayName    = (& $vswhere -latest -prerelease -property displayName)    -as [string]
        $installPath    = (& $vswhere -latest -prerelease -property installationPath) -as [string]
        Write-Host "Installation : $installPath"
        Write-Host "Display name : $displayName"
        Write-Host "Version      : $installVersion"

        $msvcDir = Join-Path $installPath "VC\Tools\MSVC"
        if (-not (Test-Path $msvcDir)) {
          Write-Error "VC\Tools\MSVC directory not found in $installPath."
          exit 1
        }
        $vc145 = Get-ChildItem $msvcDir -Directory | Where-Object { $_.Name -match "^14\.5" } | Sort-Object Name -Descending
        if (-not $vc145) {
          Write-Host "Installed MSVC tool directories:"
          Get-ChildItem $msvcDir -Directory | ForEach-Object { Write-Host "  $($_.Name)" }
          Write-Error "::error::v145 (MSVC 14.5x) tool directory NOT found in $msvcDir. Expected runner image is windows-2025-vs2026."
          exit 1
        }
        $vcToolsVersion = $vc145[0].Name
        Write-Host "::notice::v145 (MSVC $vcToolsVersion) toolset detected at $($vc145[0].FullName)"
        if ($installVersion -notmatch "^18\.") {
          Write-Error "::error::VS major version is $installVersion, expected 18.x (Visual Studio 2026)."
          exit 1
        }

    - name: Cache vcpkg binary cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: |
          ${{ github.workspace }}/vcpkg_cache
        key: vcpkg-v3-${{ runner.os }}-${{ inputs.platform }}-${{ env.PLATFORM_TOOLSET }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-v3-${{ runner.os }}-${{ inputs.platform }}-${{ env.PLATFORM_TOOLSET }}-
          vcpkg-v3-${{ runner.os }}-${{ inputs.platform }}-

    - name: Bootstrap vcpkg
      shell: pwsh
      run: |
        $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE "vcpkg"
        if (-not (Test-Path (Join-Path $vcpkgRoot ".git"))) {
          git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
        }
        $vcpkgManifest = Join-Path $env:GITHUB_WORKSPACE "vcpkg.json"
        $baseline = (Get-Content $vcpkgManifest -Raw | ConvertFrom-Json)."builtin-baseline"
        if (-not $baseline) {
          throw "vcpkg.json is missing builtin-baseline; refusing to bootstrap an unpinned vcpkg tip."
        }
        if ($baseline -notmatch '^[0-9a-fA-F]{40}$') {
          throw "vcpkg.json builtin-baseline must be a 40-hex git commit (got '$baseline')."
        }
        git -C $vcpkgRoot fetch --depth 1 origin $baseline
        if ($LASTEXITCODE -ne 0) { throw "Failed to fetch vcpkg baseline $baseline (exit $LASTEXITCODE)." }
        git -C $vcpkgRoot checkout --detach $baseline
        if ($LASTEXITCODE -ne 0) { throw "Failed to checkout vcpkg baseline $baseline (exit $LASTEXITCODE)." }
        $detached = (git -C $vcpkgRoot rev-parse HEAD).Trim()
        if ($detached -ne $baseline) {
          throw "vcpkg HEAD $detached does not match required baseline $baseline."
        }
        & "$vcpkgRoot/bootstrap-vcpkg.bat" -disableMetrics
        if ($LASTEXITCODE -ne 0) {
          throw "vcpkg bootstrap failed with exit code $LASTEXITCODE"
        }
        echo "VCPKG_INSTALLATION_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
        echo "VCPKG_BINARY_SOURCES=clear;files,$($env:GITHUB_WORKSPACE)/vcpkg_cache,readwrite" >> $env:GITHUB_ENV

    - name: Install vcpkg dependencies (manifest mode)
      shell: pwsh
      run: |
        $triplet = if ("${{ inputs.platform }}" -eq "x64") { "x64-windows-static" } else { "x86-windows-static" }
        echo "VCPKG_TARGET_TRIPLET=$triplet" >> $env:GITHUB_ENV
        Write-Host "VCPKG_BINARY_SOURCES=$env:VCPKG_BINARY_SOURCES"
        Write-Host "Triplet=$triplet"
        & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install --triplet=$triplet

    - name: Verify BugSplat SDK slice (x64)
      if: ${{ inputs.platform == 'x64' }}
      shell: pwsh
      env:
        ENVY_BUILD_CONFIGURATION: ${{ inputs.configuration }}
      run: |
        $config = $env:ENVY_BUILD_CONFIGURATION
        if (-not $config) { throw 'Missing build configuration input' }
        $lib = "ThirdParty/BugSplat/x64/$config/lib/mt/BugSplat.lib"
        if (-not (Test-Path -LiteralPath $lib)) {
          throw "Missing $lib. Import the login-gated Windows Native C++ SDK (not BugSplat-Git/bugsplat-crashpad /MD Crashpad bundles). Run scripts/import-bugsplat-sdk.ps1, commit ThirdParty/BugSplat. See ThirdParty/BugSplat/README.md."
        }
        pwsh scripts/verify-bugsplat-sdk-committed.ps1

    # Measured 2026-09-19 on windows-2025-vs2026: nuget restore prints
    # "Nothing to do" and still costs ~22s. Skip unless a packages.config
    # exists outside third-party trees (Services/, HashLib/HashLib/, and
    # Plugins/{PluginWizard,RatDVDPlugin,SWFPlugin}).
    - name: Restore NuGet packages (if any)
      shell: pwsh
      run: |
        $packages = @(Get-ChildItem -Path . -Recurse -Filter packages.config -File -ErrorAction SilentlyContinue |
          Where-Object {
            $_.FullName -notmatch '\\.git\\' -and
            $_.FullName -notmatch '\\(Services|HashLib\\HashLib)\\' -and
            $_.FullName -notmatch '\\Plugins\\(PluginWizard|RatDVDPlugin|SWFPlugin)\\'
          })
        if ($packages.Count -eq 0) {
          Write-Host "No first-party packages.config found; skipping nuget restore (~22s saved)."
          exit 0
        }
        Write-Host "Found packages.config:$([Environment]::NewLine)$(($packages | ForEach-Object FullName) -join [Environment]::NewLine)"
        nuget restore "Visual Studio\Envy.sln" -NonInteractive
      continue-on-error: true

    - name: Export effective PlatformToolset
      id: toolset
      shell: pwsh
      run: |
        $effective = "$env:PLATFORM_TOOLSET"
        [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "PlatformToolset=$effective`n", [System.Text.UTF8Encoding]::new($false))
        [System.IO.File]::AppendAllText($env:GITHUB_ENV, "EFFECTIVE_TOOLSET=$effective`n", [System.Text.UTF8Encoding]::new($false))
        Write-Host "Effective PlatformToolset = $effective"

    - name: Build solution
      shell: cmd
      env:
        ENVY_BUGSPLAT_DATABASE: ${{ inputs.envy-bugsplat-database }}
      run: |
        set "BUGSPLAT_MSBUILD_PROP="
        if not "%ENVY_BUGSPLAT_DATABASE%"=="" set "BUGSPLAT_MSBUILD_PROP=/p:EnvyBugSplatDatabase=%ENVY_BUGSPLAT_DATABASE%"
        set "VCPKG_MSBUILD_PROPS="
        if "${{ inputs.platform }}"=="Win32" set "VCPKG_MSBUILD_PROPS=/p:VcpkgEnableManifest=true /p:VcpkgEnabled=true /p:VcpkgTriplet=%VCPKG_TARGET_TRIPLET%"
        msbuild "%SOLUTION%" ^
          %MSBUILD_PARALLEL% ^
          /nologo ^
          /verbosity:minimal ^
          /p:Configuration=${{ inputs.configuration }} ^
          /p:Platform=${{ inputs.platform }} ^
          %BUGSPLAT_MSBUILD_PROP% ^
          %VCPKG_MSBUILD_PROPS% ^
          /p:PlatformToolset=${{ steps.toolset.outputs.PlatformToolset }} ^
          /p:WindowsTargetPlatformVersion=10.0 ^
          /p:UseMultiToolTask=%MSBUILD_USE_MULTI_TOOL_TASK% ^
          /p:EnforceProcessCountAcrossBuilds=true ^
          /p:TreatWarningsAsErrors=false ^
          /flp:LogFile=build-${{ inputs.platform }}-${{ inputs.configuration }}.log;Verbosity=detailed;Encoding=UTF-8 ^
          /flp1:LogFile=build-${{ inputs.platform }}-${{ inputs.configuration }}.warnings.log;WarningsOnly;Verbosity=normal ^
          /flp2:LogFile=build-${{ inputs.platform }}-${{ inputs.configuration }}.errors.log;ErrorsOnly;Verbosity=normal

    - name: Verify BugSplat output layout (x64)
      if: ${{ inputs.platform == 'x64' }}
      shell: pwsh
      run: |
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
        $install = (& $vswhere -latest -prerelease -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
        $toolsRoot = Join-Path $install 'VC\Tools\MSVC'
        $tools = Get-ChildItem -LiteralPath $toolsRoot -Directory |
          Where-Object { $_.Name -match '^14\.5' } |
          Sort-Object Name -Descending |
          Select-Object -First 1
        if (-not $tools) { throw "Active MSVC tools directory was not found under $toolsRoot" }
        pwsh scripts/verify-bugsplat-output-layout.ps1 -OutputDir "Envy/${{ inputs.configuration }} x64" -VcToolsInstallDir $tools.FullName -DisableToolchainFallback

    - name: Verify portable runtime staging (Release)
      if: ${{ inputs.configuration == 'Release' }}
      shell: pwsh
      run: |
        ./scripts/release/stage-portable.ps1 -Platform ${{ inputs.platform }} -RepoRoot $env:GITHUB_WORKSPACE

    - name: Verify installer AppCopyright on setup executable (Release)
      if: ${{ inputs.configuration == 'Release' }}
      shell: pwsh
      run: |
        $setups = @(Get-ChildItem -Path Builds -Filter *.exe -File -ErrorAction SilentlyContinue)
        if ($setups.Count -ne 1) {
          throw "Expected exactly one setup executable in Builds/, found $($setups.Count)."
        }
        pwsh scripts/installer/verify-setup-appcopyright.ps1 -SetupExePath $setups[0].FullName

    - name: Run EnvyTests
      if: ${{ inputs.run-tests == 'true' }}
      shell: cmd
      run: |
        set "EXE=tests\${{ inputs.configuration }} ${{ inputs.platform }}\EnvyTests.exe"
        if not exist "%EXE%" (
          echo ::error::EnvyTests.exe not found at %EXE%
          exit /b 1
        )
        "%EXE%"

    # On pull_request, upload logs only after failure (green PRs still paid
    # ~2s + artifact storage for unused logs). Push/dispatch keep always-on
    # retention for post-merge triage.
    - name: Upload build logs
      if: ${{ always() && inputs.upload-logs == 'true' && (github.event_name != 'pull_request' || failure()) }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: build-logs-${{ inputs.platform }}-${{ inputs.configuration }}
        path: |
          build-*.log
        if-no-files-found: ignore
        retention-days: ${{ github.event_name == 'pull_request' && 7 || 14 }}

    - name: Surface build errors to step summary
      if: ${{ failure() && github.event_name == 'pull_request' }}
      shell: pwsh
      run: |
        $errLog = "build-${{ inputs.platform }}-${{ inputs.configuration }}.errors.log"
        $warnLog = "build-${{ inputs.platform }}-${{ inputs.configuration }}.warnings.log"
        $body = New-Object System.Collections.Generic.List[string]
        $body.Add("### Build ${{ inputs.platform }} ${{ inputs.configuration }} - failures") | Out-Null
        $body.Add("") | Out-Null
        $body.Add("- Effective PlatformToolset: ``$($env:EFFECTIVE_TOOLSET)``") | Out-Null
        $body.Add("- Commit: ``${{ github.event.pull_request.head.sha }}``") | Out-Null
        $body.Add("- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}") | Out-Null
        $body.Add("") | Out-Null

        $reachedMsbuild = Test-Path $errLog

        if ($reachedMsbuild) {
          $errLines = @(Get-Content -LiteralPath $errLog -ErrorAction SilentlyContinue)
          $errFirst = $errLines | Select-Object -First 200
          $body.Add("**Reached MSBuild.** Errors captured: $($errLines.Count). Showing first $([Math]::Min(200, $errLines.Count)).") | Out-Null
          $body.Add("") | Out-Null
          $body.Add("<details><summary>First 200 MSBuild error lines</summary>") | Out-Null
          $body.Add("") | Out-Null
          $body.Add('```') | Out-Null
          foreach ($l in $errFirst) { $body.Add($l) | Out-Null }
          $body.Add('```') | Out-Null
          $body.Add("</details>") | Out-Null
          if (Test-Path $warnLog) {
            $warn = @(Get-Content -LiteralPath $warnLog -ErrorAction SilentlyContinue) | Select-Object -First 80
            if ($warn.Count -gt 0) {
              $body.Add("") | Out-Null
              $body.Add("<details><summary>First 80 warning lines</summary>") | Out-Null
              $body.Add("") | Out-Null
              $body.Add('```') | Out-Null
              foreach ($l in $warn) { $body.Add($l) | Out-Null }
              $body.Add('```') | Out-Null
              $body.Add("</details>") | Out-Null
            }
          }
        } else {
          $body.Add("**Build failed before MSBuild started.** Likely a setup-msbuild, vcpkg bootstrap, or vcpkg install issue.") | Out-Null
          $body.Add("") | Out-Null
          $vcpkgLogs = @()
          if ($env:VCPKG_INSTALLATION_ROOT -and (Test-Path "$env:VCPKG_INSTALLATION_ROOT/buildtrees")) {
            $vcpkgLogs = Get-ChildItem -LiteralPath "$env:VCPKG_INSTALLATION_ROOT/buildtrees" -Recurse -Filter "*.log" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 3
          }
          if ($vcpkgLogs.Count -gt 0) {
            foreach ($lg in $vcpkgLogs) {
              $tail = @(Get-Content -LiteralPath $lg.FullName -Tail 80 -ErrorAction SilentlyContinue)
              $body.Add("<details><summary>vcpkg log: $($lg.FullName) (last 80 lines)</summary>") | Out-Null
              $body.Add("") | Out-Null
              $body.Add('```') | Out-Null
              foreach ($l in $tail) { $body.Add($l) | Out-Null }
              $body.Add('```') | Out-Null
              $body.Add("</details>") | Out-Null
            }
          } else {
            $body.Add("_No vcpkg buildtree logs found - the failure is likely in setup-msbuild or the toolset detection step._") | Out-Null
          }
        }

        $bodyText = $body -join "`n"
        [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, $bodyText + "`n", [System.Text.UTF8Encoding]::new($false))

    - name: Record artifact provenance
      if: ${{ success() && inputs.upload-binaries == 'true' && inputs.configuration == 'Release' }}
      shell: pwsh
      env:
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        BUILD_PLATFORM: ${{ inputs.platform }}
      run: |
        $exe = "Envy/Release $env:BUILD_PLATFORM/Envy.exe"
        if (-not (Test-Path -LiteralPath $exe)) { throw "Missing runtime: $exe" }
        $setups = @(Get-ChildItem -LiteralPath Builds -Filter *.exe -File)
        if ($setups.Count -ne 1) { throw 'Expected one usable setup executable' }
        @{
          head = $env:PR_HEAD_SHA
          base = $env:PR_BASE_SHA
          built_commit = (git rev-parse HEAD)
          run_id = $env:GITHUB_RUN_ID
          run_attempt = $env:GITHUB_RUN_ATTEMPT
          platform = $env:BUILD_PLATFORM
          runtime_sha256 = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          setup_sha256 = (Get-FileHash -LiteralPath $setups[0].FullName -Algorithm SHA256).Hash
          runtime_test = 'NOT PERFORMED; maintainer checkpoint required'
        } | ConvertTo-Json | Set-Content -LiteralPath artifact-provenance.json -Encoding utf8

    - name: Upload binaries
      if: ${{ success() && inputs.upload-binaries == 'true' && inputs.configuration == 'Release' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: envy-${{ inputs.platform }}-${{ inputs.configuration }}
        path: |
          artifact-provenance.json
          artifacts/portable/**
          Envy/${{ inputs.configuration }} ${{ inputs.platform }}/Envy.exe
          Envy/${{ inputs.configuration }} ${{ inputs.platform }}/Envy.pdb
          Envy/${{ inputs.configuration }} ${{ inputs.platform }}/BugSplatMonitor.exe
          Envy/${{ inputs.configuration }} ${{ inputs.platform }}/BugSplatWer.dll
          Envy/${{ inputs.configuration }} ${{ inputs.platform }}/BugSplatRc.dll
          Envy/${{ inputs.configuration }} ${{ inputs.platform }}/crashpad_handler.exe
          Envy/${{ inputs.configuration }} ${{ inputs.platform }}/crashpad_wer.dll
          Envy/${{ inputs.configuration }} ${{ inputs.platform }}/*.dll
          Envy/**/Release/*.exe
          Envy/**/Release/*.dll
          Plugins/**/Release/*.dll
          Builds/**
        if-no-files-found: error
        retention-days: ${{ github.event_name == 'pull_request' && 7 || 14 }}

    - name: Upload Release PDBs
      if: ${{ success() && inputs.upload-binaries == 'true' && inputs.configuration == 'Release' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: envy-pdb-${{ inputs.platform }}-${{ inputs.configuration }}
        path: Envy/${{ inputs.configuration }} ${{ inputs.platform }}/Envy.pdb
        if-no-files-found: warn
        retention-days: 90
