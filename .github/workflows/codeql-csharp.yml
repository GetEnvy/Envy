name: CodeQL C# Manual Build

# C# analysis uses Windows and is deferred until live-test/Ready on develop.
# Full phases always publish the configuration expected by Code Scanning.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-csharp-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  phase:
    permissions:
      contents: read
    uses: ./.github/workflows/pr-phase.yml

  analyze-csharp:
    name: Analyze (csharp)
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: read
    needs: phase
    if: always()
    runs-on: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'stage:live-test')) && 'windows-2025-vs2026' || 'ubuntu-latest' }}
    timeout-minutes: 60

    steps:
      - name: Fail if phase selection failed
        if: needs.phase.result != 'success'
        run: exit 1

      - name: C# analysis deferred during Draft stabilization
        if: github.event_name == 'pull_request' && github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'stage:live-test')
        run: |
          echo '::notice::DEFERRED: no C# Windows build or CodeQL analysis ran.'
          echo 'C# analysis is DEFERRED until live-test/Ready. No SARIF validation is certified.' >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'stage:live-test')
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 1

      - name: Add MSBuild to PATH
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'stage:live-test')
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57  # v3
        with:
          msbuild-architecture: x64

      - name: Initialize CodeQL (manual C# build)
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'stage:live-test')
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4
        with:
          languages: csharp
          build-mode: manual
          # security-and-quality already includes security-extended + default.
          queries: security-and-quality

      - name: Build SkinUpdater solution (Release, Any CPU)
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'stage:live-test')
        shell: cmd
        run: |
          msbuild "Languages\Tools\SkinUpdater\SkinUpdater.sln" ^
            /m ^
            /nologo ^
            /verbosity:minimal ^
            /p:Configuration=Release ^
            /p:Platform="Any CPU"

      - name: Perform CodeQL Analysis
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'stage:live-test')
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4
        with:
          category: /language:csharp
