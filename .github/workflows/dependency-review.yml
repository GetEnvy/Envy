# Job name `Dependency review` must match Protect develop required context
# (see `.github/settings.yml` and docs/10_dev/dependency-automation.md).
name: Dependency review

on:
  pull_request:
    branches: [main, master, develop]
    # 'edited' also fires on base retarget, forcing a fresh dependency
    # comparison before a stale same-head conclusion can satisfy the
    # required-check gate against the new base.
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dep-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-1.0
          # AGPL-3.0 is allowed because Envy itself is AGPL-3.0+.

  vcpkg-baseline-check:
    name: Vcpkg manifest sanity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Validate vcpkg.json against schema
        shell: bash
        run: |
          if ! command -v jq >/dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          fi
          # Use bracket notation: jq parses `.version-string` as
          # subtraction because of the dash.
          jq -e '.name and .["version-string"] and (.dependencies | type == "array")' \
            vcpkg.json > /dev/null
          echo "vcpkg.json is structurally valid."

      - name: Require pinned builtin-baseline
        shell: bash
        run: |
          set -euo pipefail
          baseline=$(jq -r '.["builtin-baseline"] // empty' vcpkg.json)
          if [ -z "$baseline" ] || [ "$baseline" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::vcpkg.json builtin-baseline is unset or placeholder; refusing unpinned dependency set."
            exit 1
          fi
          if ! [[ "$baseline" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::vcpkg.json builtin-baseline must be a 40-hex git commit (got '$baseline')."
            exit 1
          fi
          echo "builtin-baseline = $baseline"
