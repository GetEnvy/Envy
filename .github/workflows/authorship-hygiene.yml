name: Authorship hygiene

# Isolated from security.yml so secret scanning remains independently visible.
#
# Security model (keep in sync with docs/10_dev/agents-and-automation.md):
# - Trigger is pull_request_target so the workflow YAML and GITHUB_TOKEN come
#   from the base repository, not from fork PR heads.
# - No actions/checkout of the PR workspace. A throwaway git repo fetches the
#   base SHA and PR head refs as data only; nothing from the PR is executed.
# - The scanner script is always loaded from the base SHA (GitHub Contents API)
#   so a PR cannot replace its own authorship policy before merge.
# - Permissions stay read-only. No secrets beyond GITHUB_TOKEN are used.
# See: https://docs.github.com/en/actions/reference/security/securely-using-pull_request_target

on:
  pull_request_target:
    branches: [main, master, develop]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: authorship-hygiene-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  authorship-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Authorship hygiene (commits, PR text, added lines)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA:-}" || -z "${HEAD_SHA:-}" ]]; then
            BASE_SHA="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq .base.sha)"
            HEAD_SHA="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq .head.sha)"
          fi

          trusted="${RUNNER_TEMP}/authorship-checker"
          mkdir -p "$trusted"
          # Load scanner from trusted base only (Contents API, not PR tree).
          # Fail closed on every load error, including 404: the scanner is on
          # develop, so a missing file means a bad ref or permission, not bootstrap.
          api_err="${trusted}/contents.api.err"
          set +e
          content="$(gh api "repos/${REPO}/contents/.github/scripts/check-agent-attribution.py?ref=${BASE_SHA}" --jq .content 2>"$api_err")"
          api_status=$?
          set -e
          if [[ $api_status -eq 0 && -n "${content}" ]]; then
            printf '%s' "$content" | tr -d '\n' | base64 --decode >"${trusted}/check-agent-attribution.py"
            echo "Using authorship checker from base ${BASE_SHA}"
          else
            echo "::error::Failed to load authorship checker from trusted base ${BASE_SHA} (exit ${api_status}). Failing closed."
            if [[ -s "$api_err" ]]; then
              echo "::group::Contents API error"
              cat "$api_err" || true
              echo "::endgroup::"
            fi
            exit 1
          fi

          # Throwaway repo: inspect PR commits as data; never execute them.
          mirror="$(mktemp -d)"
          git init -q "$mirror"
          git -C "$mirror" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          # Fetch the event's pinned head too: a force-push between the event and
          # this fetch moves the PR ref, and the scan must cover HEAD_SHA itself.
          git -C "$mirror" fetch --no-tags origin \
            "${BASE_SHA}" \
            "${HEAD_SHA}" \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr/${PR_NUMBER}"

          work="$(mktemp -d)"
          python3 - "$work" <<'PY'
          import json, os, sys
          from pathlib import Path
          work = Path(sys.argv[1])
          event_path = os.environ.get("GITHUB_EVENT_PATH")
          event = {}
          if event_path:
              event = json.loads(Path(event_path).read_text(encoding="utf-8"))
          pr = event.get("pull_request") or {}
          (work / "title.txt").write_text(pr.get("title") or "", encoding="utf-8")
          (work / "body.md").write_text(pr.get("body") or "", encoding="utf-8")
          PY
          if [[ ! -s "$work/title.txt" ]]; then
            gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq .title >"$work/title.txt"
            gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq -r '.body // ""' >"$work/body.md"
          fi
          cmd=(
            python3 "${trusted}/check-agent-attribution.py"
            --pr-title "$work/title.txt"
            --pr-body "$work/body.md"
            --github-repo "$REPO"
            --github-pr "$PR_NUMBER"
          )
          if [[ -n "${BASE_SHA:-}" && -n "${HEAD_SHA:-}" ]]; then
            cmd+=(--from "$BASE_SHA" --to "$HEAD_SHA" --diff)
          fi
          # FAIL findings fail the job; WARN findings annotate and still pass.
          (
            cd "$mirror"
            ATTRIBUTION_CI_ANNOTATE=1 "${cmd[@]}"
          )
          rm -rf "$work" "$mirror"
