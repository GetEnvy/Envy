name: clang-tidy (advisory)

on:
  push:
    branches: [develop]
    paths:
      - Envy/**.cpp
      - Envy/**.h
      - TorrentEnvy/**.cpp
      - TorrentEnvy/**.h
      - HashLib/**.cpp
      - HashLib/**.h
      - .clang-tidy
      - .github/workflows/clang-tidy.yml
  schedule:
    - cron: 17 4 * * *
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clang-tidy-${{ github.event_name == 'push' && github.sha || github.run_id }}
  cancel-in-progress: false

jobs:
  tidy:
    name: clang-tidy diff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy

      - name: Find changed C/C++ files and lint
        shell: bash
        run: |
          set +e
          if [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          else
            # Nightly / manual: lint files touched on develop in the last day.
            base="$(git log --since='25 hours ago' --pretty=format:%H --reverse | head -1)"
            head="${{ github.sha }}"
          fi
          if [ -z "$base" ] || [ -z "$head" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable commit range; skipping."
            exit 0
          fi
          files=$(git diff --name-only "$base...$head" -- '*.cpp' '*.h' '*.cxx' '*.hpp' 2>/dev/null \
            | grep -E '^(Envy|TorrentEnvy|HashLib)/' \
            | grep -vE '^(Services|Plugins/PluginWizard|Plugins/RatDVDPlugin|Plugins/SWFPlugin)/' \
            || true)
          if [ -z "$files" ]; then
            echo "No relevant C/C++ files changed."
            exit 0
          fi
          echo "Changed C/C++ files:"
          echo "$files"
          : > clang-tidy.log
          warned=0
          for f in $files; do
            [ -f "$f" ] || continue
            echo "::group::clang-tidy $f"
            clang-tidy --quiet "$f" -- -std=c++20 -DWIN32 -D_WINDOWS -D_UNICODE -DUNICODE \
              2>&1 | tee -a clang-tidy.log
            echo "::endgroup::"
            warned=1
          done
          if [ "$warned" -eq 1 ]; then
            echo "::warning::clang-tidy completed with advisory findings - see the uploaded report."
          fi
          exit 0

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: clang-tidy-report
          path: clang-tidy.log
          if-no-files-found: ignore
          retention-days: 7
