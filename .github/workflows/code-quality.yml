name: Code Quality

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  schedule:
    # Nightly run (default branch only) so the expensive MSVC code-analysis
    # build stays off the PR critical path while still being exercised daily.
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: code-quality-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  changes:
    name: Classify (quality)
    if: github.event_name != 'schedule'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/classify-changes.yml

  static-analysis:
    name: Static Analysis
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
    # Expensive full-solution code-analysis build. Skip it on pull_request and
    # workflow_dispatch — CodeQL already gates PRs; this runs on push to the
    # integration branches and on the nightly schedule.
    if: github.event_name == 'push' || github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57  # v3

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -Path . -Recurse -Filter packages.config -File -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -notmatch '\\.git\\' -and
              $_.FullName -notmatch '\\(Services|HashLib\\HashLib)\\' -and
              $_.FullName -notmatch '\\Plugins\\(PluginWizard|RatDVDPlugin|SWFPlugin)\\'
            })
          if ($packages.Count -eq 0) {
            Write-Host "No first-party packages.config found; skipping nuget restore."
            exit 0
          }
          nuget restore "Visual Studio/Envy.sln"

      - name: Run Code Analysis
        run: |
          msbuild /m /p:Configuration=Release /p:Platform=x64 /p:RunCodeAnalysis=true /p:CodeAnalysisRuleSet=NativeRecommendedRules.ruleset "Visual Studio/Envy.sln"
        continue-on-error: true

      - name: Upload Analysis Results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: code-analysis-results
          path: |
            **/*.nativecodeanalysis.xml
          retention-days: 7

  lint-check:
    name: Format Check
    # Independent of classify-changes: required context must always emit, and a
    # classifier failure must not suppress formatting.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    env:
      CLANG_FORMAT_MAJOR: "18"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Pin to PR head so clang-format-diff hunk line numbers match the tip
          # (default merge ref can shift lines vs base...head hunks).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Fetch develop for format base
        if: github.event_name == 'workflow_dispatch'
        run: git fetch --no-tags origin develop:refs/remotes/origin/develop

      - name: Install clang-format ${{ env.CLANG_FORMAT_MAJOR }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y "clang-format-${CLANG_FORMAT_MAJOR}"
          clang-format-${CLANG_FORMAT_MAJOR} --version
          command -v "clang-format-diff-${CLANG_FORMAT_MAJOR}"
          command -v "clang-format-${CLANG_FORMAT_MAJOR}"

      - name: Block new encoding corruption in changed first-party sources
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/develop' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if ! git rev-parse --verify "${BASE_SHA}^{commit}" >/dev/null 2>&1; then
            echo "::error::BASE_SHA is not a valid commit: ${BASE_SHA}"
            exit 1
          fi

          trusted_script="$(mktemp)"
          trusted_lib="$(mktemp)"
          use_lib=0
          if git cat-file -e "${BASE_SHA}:.github/scripts/check_source_encoding_lib.py" 2>/dev/null; then
            git show "${BASE_SHA}:.github/scripts/check-source-encoding.sh" >"$trusted_script"
            git show "${BASE_SHA}:.github/scripts/check_source_encoding_lib.py" >"$trusted_lib"
            use_lib=1
            echo "Using encoding guard from base ${BASE_SHA}"
          elif git cat-file -e "${BASE_SHA}:.github/scripts/check-source-encoding.sh" 2>/dev/null; then
            git show "${BASE_SHA}:.github/scripts/check-source-encoding.sh" >"$trusted_script"
            echo "Using legacy check-source-encoding.sh from base ${BASE_SHA}"
          else
            echo "::warning::Encoding guard not on PR base ${BASE_SHA}; skipping in this workflow (self-test still runs in build.yml)."
            exit 0
          fi
          if [[ "$use_lib" -eq 1 ]]; then
            CHECK_ENCODING_ROOT="${{ github.workspace }}" CHECK_ENCODING_LIB="$trusted_lib" bash "$trusted_script"
          else
            CHECK_ENCODING_ROOT="${{ github.workspace }}" bash "$trusted_script"
          fi

      - name: clang-format-diff on changed hunks
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/develop' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CLANG_FORMAT_MAJOR: ${{ env.CLANG_FORMAT_MAJOR }}
          CLANG_FORMAT_BIN: clang-format-${{ env.CLANG_FORMAT_MAJOR }}
          # Encoding-safe wrapper: stock clang-format-diff crashes on ISO-8859
          # Envy sources (copyright 0xA9). Absolute path so format-check.sh
          # `command -v` accepts it.
          CLANG_FORMAT_DIFF: ${{ github.workspace }}/.github/scripts/clang-format-diff-safe
        run: |
          set -euo pipefail
          # Prefer Format Check inputs from the PR base so a PR cannot bypass
          # the required check by rewriting format-check.sh or relaxing
          # .clang-format on the branch alone. Hunk content still comes from
          # the HEAD working tree (checkout ref above).
          if ! git rev-parse --verify "${BASE_SHA}^{commit}" >/dev/null 2>&1; then
            echo "::error::BASE_SHA is not a valid commit: ${BASE_SHA}"
            exit 1
          fi

          trusted_script="$(mktemp)"
          if git cat-file -e "${BASE_SHA}:.github/scripts/format-check.sh" 2>/dev/null; then
            git show "${BASE_SHA}:.github/scripts/format-check.sh" >"$trusted_script"
            echo "Using format-check.sh from base ${BASE_SHA}"
          else
            # Bootstrap only: script is new on this PR and absent from develop.
            # After merge, the base path above applies and this branch is unused.
            echo "::warning::format-check.sh absent on base ${BASE_SHA}; bootstrap from HEAD ${HEAD_SHA}"
            git show "${HEAD_SHA}:.github/scripts/format-check.sh" >"$trusted_script"
          fi

          if ! git cat-file -e "${BASE_SHA}:.clang-format" 2>/dev/null; then
            echo "::error::.clang-format missing on base ${BASE_SHA}"
            exit 1
          fi
          git show "${BASE_SHA}:.clang-format" >.clang-format
          echo "Pinned .clang-format from base ${BASE_SHA}"
          if git cat-file -e "${BASE_SHA}:.clang-format-ignore" 2>/dev/null; then
            git show "${BASE_SHA}:.clang-format-ignore" >.clang-format-ignore
            echo "Pinned .clang-format-ignore from base ${BASE_SHA}"
          fi

          bash "$trusted_script"

  documentation-check:
    name: Documentation Check
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    # Always emit this required context on PRs (even when classify fails).
    # Classify failure fails this job explicitly; when classify succeeds and
    # docs are out of scope, report success via no-op so Protect develop never
    # waits on a skipped/missing check (see docs/10_dev/CI_AUDIT_2026-09.md).
    # A cancelled classifier must not certify documentation validation.
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Fail if classification failed
        if: needs.changes.result != 'success'
        run: |
          echo "::error::Change classification did not succeed (${{ needs.changes.result }})."
          exit 1

      - name: Checkout code
        if: needs.changes.result == 'success' && needs.changes.outputs.run_docs_check == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Docs check not required for this change set
        if: needs.changes.result == 'success' && needs.changes.outputs.run_docs_check != 'true'
        run: |
          echo "::notice::Documentation Check no-op (classify run_docs_check=false)."

      - name: Check for README updates
        if: needs.changes.result == 'success' && needs.changes.outputs.run_docs_check == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changed=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename' || true)
          if [ -z "$changed" ]; then
            echo "No files changed in this pull request; skipping README advisory."
            exit 0
          fi
          if echo "$changed" | grep -qE '^(Envy|Services|Plugins|HashLib|TorrentEnvy|Remote)/'; then
            if ! echo "$changed" | grep -Fxq 'README.md'; then
              echo "::notice::No README updates in this PR"
            fi
          fi

      - name: Check for broken links in markdown
        if: needs.changes.result == 'success' && needs.changes.outputs.run_docs_check == 'true'
        uses: gaurav-nelson/github-action-markdown-link-check@5c5dfc0ac2e225883c0e5f03a85311ec2830d368  # v1
        with:
          use-quiet-mode: "yes"
          use-verbose-mode: "no"
        continue-on-error: true

      - name: Interop harness self-test and dry-run
        if: needs.changes.result == 'success' && needs.changes.outputs.run_docs_check == 'true'
        run: |
          set -euo pipefail
          python3 tools/interop/run.py --self-test
          python3 tools/interop/run.py --dry-run --artifact-dir "$RUNNER_TEMP/interop-dry-run"

  remote-js-security-tests:
    name: Remote JS Security Tests
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    if: >
      (github.event_name == 'pull_request' && needs.changes.outputs.run_remote_js == 'true') ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Remote/tests/package-lock.json

      - name: Install JS test dependencies
        working-directory: Remote/tests
        run: npm ci --no-audit --no-fund

      - name: Run Remote JS tests
        working-directory: Remote/tests
        run: npm test
