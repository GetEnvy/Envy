name: Build

# checkov:skip=CKV_GHA_7:Manual reruns need an operator-selected configuration.
on:
  push:
    branches: [main, develop]
    paths-ignore:
      # yamllint disable-line rule:quoted-strings -- ** must be quoted (YAML alias)
      - "**.md"
      - Languages/**
      - Templates/**
      - Skins/**
      - Data/**
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        default: Release
        type: choice
        options: [Release, Debug]

permissions: {}

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SOLUTION: Visual Studio\Envy.sln
  PLATFORM_TOOLSET: v145

jobs:
  phase:
    permissions:
      contents: read
    uses: ./.github/workflows/pr-phase.yml

  changes:
    name: Classify (build)
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/classify-changes.yml

  lint-build-files:
    name: Lint build files
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Verify all vcxproj use v145
        shell: bash
        run: |
          bad=$(grep -l "v141_xp\|<PlatformToolset>v14[01234]<" $(find . -name "*.vcxproj" -not -path "./.git/*" -not -path "./Plugins/PluginWizard/*") || true)
          if [ -n "$bad" ]; then
            echo "::error::Projects still using legacy toolset:"
            echo "$bad"
            exit 1
          fi
          echo "All .vcxproj files use v145 or newer."

      - name: Verify Envy.sln is VS 16+ format
        shell: bash
        run: |
          if ! grep -q "Format Version 12.00" "Visual Studio/Envy.sln"; then
            echo "::error::Envy.sln is not Format Version 12.00"
            exit 1
          fi

      - name: Verify no _ATL_XP_TARGETING remains
        shell: bash
        run: |
          # PluginWizard templates are intentionally left untouched.
          bad=$(grep -lr "_ATL_XP_TARGETING" --include="*.vcxproj" --exclude-dir=PluginWizard . || true)
          if [ -n "$bad" ]; then
            echo "::error::_ATL_XP_TARGETING preprocessor macro must be removed from:"
            echo "$bad"
            exit 1
          fi
          echo "_ATL_XP_TARGETING absent from first-party vcxproj files."

      - name: Classify-changes self-test
        shell: bash
        run: bash .github/scripts/classify-changes.selftest.sh

      - name: PR lifecycle regression tests
        run: python3 .github/scripts/pr-phase.selftest.py

      - name: Ruleset audit self-test
        run: python3 .github/scripts/audit-ruleset.selftest.py

      - name: BugSplat SDK import self-test
        shell: pwsh
        run: pwsh scripts/import-bugsplat-sdk.selftest.ps1

      - name: BugSplat VC runtime copy self-test
        shell: pwsh
        run: pwsh scripts/copy-bugsplat-vc-runtime.selftest.ps1

      - name: Installer Main.iss UTF-8 copyright guard
        shell: bash
        run: |
          bash .github/scripts/check-installer-main-iss-encoding.sh
          bash .github/scripts/check-installer-main-iss-encoding.selftest.sh

      - name: Format-check self-test
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          bash .github/scripts/format-check.selftest.sh

      - name: Source-encoding guard self-test
        shell: bash
        run: bash .github/scripts/check-source-encoding.selftest.sh

      - name: Self-test compile_commands generator
        shell: pwsh
        run: pwsh ./tools/dev/generate-compile-commands.ps1 -SelfTest

  build-x64-release:
    name: Build x64 Release
    permissions:
      contents: read
    needs: [changes, phase]
    # Keep the context visible; Draft success only certifies phase deferral.
    # Every Ready/live-test PR runs the actual build, including docs-only PRs.
    if: >
      always() && (
        github.event_name == 'pull_request' ||
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.configuration == 'Release')
      )
    # Runner selection uses immutable PR event data; phase output is advisory
    # and must not be able to suppress required Windows validation.
    runs-on: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'stage:live-test')) && 'windows-2025-vs2026' || 'ubuntu-latest' }}
    timeout-minutes: 120
    # Hosted runners hit C1083 (PCH permission denied) when Envy.pch is built
    # under parallel CL/MSBuild; keep /m:1 until a measured A/B on
    # windows-2025-vs2026 proves MTT/CL_MPCount is safe (see CI_AUDIT_2026-09).
    env:
      MSBUILD_PARALLEL: /m:1
      MSBUILD_USE_MULTI_TOOL_TASK: false
    steps:
      - name: Fail if classification failed
        if: needs.changes.result != 'success' || needs.phase.result != 'success'
        run: |
          echo "::error::Path/phase classification did not succeed."
          exit 1

      - name: Windows validation deferred during Draft stabilization
        if: needs.changes.result == 'success' && github.event_name == 'pull_request' && github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'stage:live-test')
        run: |
          echo "::notice::DEFERRED: x64 Windows build and EnvyTests have NOT run. Maintainer must request stage:live-test."
          echo "DEFERRED: no x64 Windows validation or runtime test. PR remains Draft." >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        if: >
          needs.changes.result == 'success' && (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'stage:live-test'))
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Build x64 Release
        if: >
          needs.changes.result == 'success' && (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'stage:live-test'))
        uses: ./.github/actions/windows-msbuild
        with:
          platform: x64
          configuration: Release
          run-tests: "true"
          upload-binaries: "true"
          envy-bugsplat-database: ${{ (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && vars.ENVY_BUGSPLAT_DATABASE || '' }}

  build-win32-release:
    name: Build Win32 Release
    permissions:
      contents: read
    needs: [changes, phase]
    # Always emit this required context on PRs (mirror Build x64 Release).
    if: >
      always() && (
        github.event_name == 'pull_request' ||
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.configuration == 'Release')
      )
    runs-on: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'stage:live-test')) && 'windows-2025-vs2026' || 'ubuntu-latest' }}
    timeout-minutes: 120
    env:
      MSBUILD_PARALLEL: /m:1
      MSBUILD_USE_MULTI_TOOL_TASK: false
    steps:
      - name: Fail if classification failed
        if: needs.changes.result != 'success' || needs.phase.result != 'success'
        run: |
          echo "::error::Path/phase classification did not succeed."
          exit 1

      - name: Windows validation deferred during Draft stabilization
        if: needs.changes.result == 'success' && github.event_name == 'pull_request' && github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'stage:live-test')
        run: |
          echo "::notice::DEFERRED: Win32 Windows build and EnvyTests have NOT run. Maintainer must request stage:live-test."
          echo "DEFERRED: no Win32 Windows validation or runtime test. PR remains Draft." >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        if: >
          needs.changes.result == 'success' && (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'stage:live-test'))
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Build Win32 Release
        if: >
          needs.changes.result == 'success' && (github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'stage:live-test'))
        uses: ./.github/actions/windows-msbuild
        with:
          platform: Win32
          configuration: Release
          run-tests: "true"
          upload-binaries: "true"

  build-debug:
    name: Build ${{ matrix.platform }} Debug
    permissions:
      contents: read
    needs: changes
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.configuration == 'Debug')
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, Win32]
    env:
      MSBUILD_PARALLEL: /m:1
      MSBUILD_USE_MULTI_TOOL_TASK: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Build ${{ matrix.platform }} Debug
        uses: ./.github/actions/windows-msbuild
        with:
          platform: ${{ matrix.platform }}
          configuration: Debug
          run-tests: "true"
          upload-binaries: "false"
