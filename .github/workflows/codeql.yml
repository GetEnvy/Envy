name: CodeQL Advanced

# CodeQL jobs intentionally do NOT depend on classify-changes. A classifier
# failure must never suppress language configurations that Protect develop
# Code Scanning expects on every PR (c-cpp, javascript-typescript, python,
# and actions).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # Weekly scan on Sunday early morning UTC
    - cron: 13 4 * * 0
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SOLUTION: Visual Studio\Envy.sln
  PLATFORM_TOOLSET: v145

jobs:
  analyze-cpp:
    name: Analyze (c-cpp)
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'windows-2025-vs2026' }}
    timeout-minutes: 180
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: read
    env:
      MSBUILD_PARALLEL: /m:1
      MSBUILD_USE_MULTI_TOOL_TASK: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      # Pull requests use build-mode: none so CodeQL does not rebuild the
      # solution (the Build x64 Release job already compiled it). develop,
      # schedule, and manual runs keep a full traced MSBuild for precision.
      - name: Initialize CodeQL (PR, no build)
        if: github.event_name == 'pull_request'
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4
        with:
          languages: c-cpp
          build-mode: none

      - name: Add MSBuild to PATH
        if: github.event_name != 'pull_request'
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57  # v3
        with:
          msbuild-architecture: x64

      - name: Cache vcpkg binary cache
        if: github.event_name != 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-v3-${{ runner.os }}-x64-${{ env.PLATFORM_TOOLSET }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-v3-${{ runner.os }}-x64-${{ env.PLATFORM_TOOLSET }}-
            vcpkg-v3-${{ runner.os }}-x64-

      - name: Bootstrap vcpkg
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE "vcpkg"
          if (-not (Test-Path (Join-Path $vcpkgRoot ".git"))) {
            git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          }
          $vcpkgManifest = Join-Path $env:GITHUB_WORKSPACE "vcpkg.json"
          $baseline = (Get-Content $vcpkgManifest -Raw | ConvertFrom-Json)."builtin-baseline"
          if (-not $baseline) {
            throw "vcpkg.json is missing builtin-baseline; refusing to bootstrap an unpinned vcpkg tip."
          }
          if ($baseline -notmatch '^[0-9a-fA-F]{40}$') {
            throw "vcpkg.json builtin-baseline must be a 40-hex git commit (got '$baseline')."
          }
          git -C $vcpkgRoot fetch --depth 1 origin $baseline
          if ($LASTEXITCODE -ne 0) { throw "Failed to fetch vcpkg baseline $baseline (exit $LASTEXITCODE)." }
          git -C $vcpkgRoot checkout --detach $baseline
          if ($LASTEXITCODE -ne 0) { throw "Failed to checkout vcpkg baseline $baseline (exit $LASTEXITCODE)." }
          $detached = (git -C $vcpkgRoot rev-parse HEAD).Trim()
          if ($detached -ne $baseline) {
            throw "vcpkg HEAD $detached does not match required baseline $baseline."
          }
          & "$vcpkgRoot/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg bootstrap failed with exit code $LASTEXITCODE"
          }
          echo "VCPKG_INSTALLATION_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          echo "VCPKG_BINARY_SOURCES=clear;files,$($env:GITHUB_WORKSPACE)/vcpkg_cache,readwrite" >> $env:GITHUB_ENV

      - name: Install vcpkg dependencies (manifest mode)
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          echo "VCPKG_TARGET_TRIPLET=x64-windows-static" >> $env:GITHUB_ENV
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install --triplet=x64-windows-static

      - name: Initialize CodeQL (manual build)
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4
        with:
          languages: c-cpp
          build-mode: manual

      - name: Build solution (x64 Release)
        if: github.event_name != 'pull_request'
        shell: cmd
        run: |
          msbuild "%SOLUTION%" ^
            %MSBUILD_PARALLEL% ^
            /nologo ^
            /verbosity:minimal ^
            /p:Configuration=Release ^
            /p:Platform=x64 ^
            /p:PlatformToolset=%PLATFORM_TOOLSET% ^
            /p:WindowsTargetPlatformVersion=10.0 ^
            /p:UseMultiToolTask=%MSBUILD_USE_MULTI_TOOL_TASK% ^
            /p:EnforceProcessCountAcrossBuilds=true ^
            /p:TreatWarningsAsErrors=false

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4
        with:
          category: /language:c-cpp

  analyze-js:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4
        with:
          languages: javascript-typescript
          build-mode: none
          # Shared codeql-config.yml only allows C++ trees; Remote JS lives under Remote/.
          config-file: .github/codeql/codeql-config-javascript.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4
        with:
          category: /language:javascript-typescript

  analyze-python:
    name: Analyze (python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4
        with:
          languages: python
          build-mode: none
          # Shared codeql-config.yml only allows C++ trees; Python lives under
          # tools/ and .github/scripts/.
          config-file: .github/codeql/codeql-config-python.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4
        with:
          category: /language:python

  analyze-actions:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4
        with:
          languages: actions
          build-mode: none
          # Shared codeql-config.yml excludes .github/; Actions YAML lives there.
          config-file: .github/codeql/codeql-config-actions.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4
        with:
          category: /language:actions
