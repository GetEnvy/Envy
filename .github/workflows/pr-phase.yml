name: PR validation phase

on:
  workflow_call:
    outputs:
      phase:
        value: ${{ jobs.phase.outputs.phase }}
      full_validation:
        value: ${{ jobs.phase.outputs.full_validation }}

permissions:
  contents: read

jobs:
  phase:
    name: Select validation phase
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      phase: ${{ steps.phase.outputs.phase }}
      full_validation: ${{ steps.phase.outputs.full_validation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select phase (not merge eligibility)
        id: phase
        run: python3 .github/scripts/pr-phase.py
      - name: Explain validation scope
        env:
          PHASE: ${{ steps.phase.outputs.phase }}
        run: |
          echo "Validation phase: $PHASE" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PHASE" = draft ]; then
            echo 'Windows validation is DEFERRED; no Windows build or runtime test is certified.' >> "$GITHUB_STEP_SUMMARY"
          fi
