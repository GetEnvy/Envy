name: Crash Probe

# Isolated Crashpad vs Sentry Native evaluation for #90.
# Not a required Protect develop check. Not Envy.sln.

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tools/crash-probe/**"
      - ".github/workflows/crash-probe.yml"
  push:
    branches: [develop]
    paths:
      - "tools/crash-probe/**"
      - ".github/workflows/crash-probe.yml"
  workflow_dispatch:
    inputs:
      include_sentry:
        description: "Also build/run Sentry Native Option B matrix"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: crash-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  consent:
    name: Consent (crash probe)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Static consent checks
        run: bash tools/crash-probe/check-consent.sh

  probe:
    name: Crash Probe (${{ matrix.backend }}, ${{ matrix.platform }})
    needs: consent
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Product decision D-019 is Crashpad. Sentry Native remains Option B in
        # tools/crash-probe (manual / workflow_dispatch comparison only).
        backend: [crashpad]
        platform: [x64, Win32]
    env:
      PLATFORM_TOOLSET: v145
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57  # v3
        with:
          msbuild-architecture: x64

      - name: Select probe manifest
        shell: pwsh
        run: |
          $src = "tools/crash-probe/vcpkg-${{ matrix.backend }}.json"
          Copy-Item -LiteralPath $src -Destination "tools/crash-probe/vcpkg.json" -Force
          Get-Content -LiteralPath "tools/crash-probe/vcpkg.json"

      - name: Cache vcpkg binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: crash-probe-v1-${{ matrix.backend }}-${{ matrix.platform }}-${{ hashFiles('tools/crash-probe/vcpkg-crashpad.json', 'tools/crash-probe/vcpkg-sentry.json') }}
          restore-keys: |
            crash-probe-v1-${{ matrix.backend }}-${{ matrix.platform }}-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:VCPKG_INSTALLATION_ROOT")) {
            git clone https://github.com/microsoft/vcpkg.git "$env:GITHUB_WORKSPACE/vcpkg"
            & "$env:GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
            if ($LASTEXITCODE -ne 0) {
              throw "vcpkg bootstrap failed with exit code $LASTEXITCODE"
            }
            echo "VCPKG_INSTALLATION_ROOT=$env:GITHUB_WORKSPACE/vcpkg" >> $env:GITHUB_ENV
          }
          echo "VCPKG_BINARY_SOURCES=clear;files,$($env:GITHUB_WORKSPACE)/vcpkg_cache,readwrite" >> $env:GITHUB_ENV

      - name: Install probe vcpkg dependencies
        shell: pwsh
        run: |
          $triplet = if ("${{ matrix.platform }}" -eq "x64") { "x64-windows-static" } else { "x86-windows-static" }
          echo "VCPKG_TARGET_TRIPLET=$triplet" >> $env:GITHUB_ENV
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install --triplet=$triplet --x-manifest-root="$env:GITHUB_WORKSPACE/tools/crash-probe"
          $installed = Join-Path $env:GITHUB_WORKSPACE "tools/crash-probe/vcpkg_installed/$triplet"
          $lib = Join-Path $installed "lib"
          Write-Host "=== $lib ==="
          if (Test-Path $lib) {
            Get-ChildItem -LiteralPath $lib -File | ForEach-Object { Write-Host $_.Name }
          } else {
            Write-Host "lib directory missing"
          }
          Get-ChildItem -Path $installed -Recurse -Filter "*.lib" -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host $_.FullName }

      - name: Build CrashProbe
        shell: cmd
        run: |
          set TRIPLET=%VCPKG_TARGET_TRIPLET%
          msbuild "tools\crash-probe\CrashProbe.vcxproj" /m /nologo /verbosity:minimal /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:PlatformToolset=%PLATFORM_TOOLSET% /p:WindowsTargetPlatformVersion=10.0 /p:CrashProbeBackend=${{ matrix.backend }} /p:VcpkgEnableManifest=true /p:VcpkgEnabled=true /p:VcpkgTriplet=%TRIPLET% /p:VcpkgManifestRoot=%CD%\tools\crash-probe

      - name: Stage handler and run probe
        shell: pwsh
        run: |
          $platform = "${{ matrix.platform }}"
          $backend = "${{ matrix.backend }}"
          $exe = Join-Path $env:GITHUB_WORKSPACE "tools\crash-probe\out\Release-$platform-$backend\CrashProbe.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "missing $exe" }
          $installed = Join-Path $env:GITHUB_WORKSPACE "tools\crash-probe\vcpkg_installed\$env:VCPKG_TARGET_TRIPLET"
          $handler = Get-ChildItem -Path $installed -Recurse -Filter "crashpad_handler.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\debug\\' } |
            Select-Object -First 1
          if (-not $handler) {
            $handler = Get-ChildItem -Path $installed -Recurse -Filter "crashpad_handler.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $handler) { throw "crashpad_handler.exe not installed for $backend / $env:VCPKG_TARGET_TRIPLET" }
          $wer = @(Get-ChildItem -Path $installed -Recurse -Filter "crashpad_wer*.dll" -ErrorAction SilentlyContinue)
          Write-Host "Handler: $($handler.FullName) ($($handler.Length) bytes)"
          Write-Host "WER modules: $($wer.Count)"
          $wer | ForEach-Object { Write-Host "  $($_.FullName) ($($_.Length) bytes)" }
          $outDir = Join-Path $env:GITHUB_WORKSPACE "tools\crash-probe\out\results-$backend-$platform"
          & "$env:GITHUB_WORKSPACE\tools\crash-probe\run-probe.ps1" -Exe $exe -Backend $backend -Handler $handler.FullName -OutDir $outDir

      - name: Upload probe measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: crash-probe-${{ matrix.backend }}-${{ matrix.platform }}
          path: |
            tools/crash-probe/out/Release-${{ matrix.platform }}-${{ matrix.backend }}/
            tools/crash-probe/out/results-${{ matrix.backend }}-${{ matrix.platform }}/
          if-no-files-found: warn
          retention-days: 30
